<style>
:root{--bg:#0b0f19;--bg2:#111827;--bg3:#1e293b;--bg4:#24304460;--border:#1e293b;--border2:#334155;--text:#e2e8f0;--muted:#94a3b8;--dim:#64748b;--accent:#3b82f6;--accent2:#1d4ed8;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;--cyan:#06b6d4;--orange:#f97316;--pink:#ec4899;--sidebarW:200px;--radius:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;background:var(--bg);color:var(--text);font-size:14px;display:flex}

/* === Sidebar === */
.sidebar{width:var(--sidebarW);flex-shrink:0;height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:200}
.sidebar-header{padding:18px 16px 14px;border-bottom:1px solid var(--border)}
.sidebar-header .logo{font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.sidebar-header .logo .icon{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.sidebar-header .sub{font-size:11px;color:var(--dim);margin-top:4px}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 0;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
.sidebar-nav::-webkit-scrollbar{width:3px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
.nav-section{padding:8px 16px}
.nav-section-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:8px 0 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .15s;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:2px;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff;box-shadow:0 2px 12px rgba(59,130,246,.3)}
.nav-item .nav-icon{width:18px;height:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.nav-item .nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.nav-item .nav-badge{margin-left:auto;font-size:10px;background:var(--bg3);padding:2px 7px;border-radius:10px;font-weight:600}
.nav-item.active .nav-badge{background:rgba(255,255,255,.2);color:#fff}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:11px;color:var(--dim)}
.sidebar-footer .auto-info{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sidebar-footer .auto-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* === Main content === */
.main{flex:1;height:100vh;overflow:hidden;display:flex;flex-direction:column;position:relative}
.panel{display:none;flex:1;flex-direction:column;overflow:hidden}
.panel.active{display:flex}
.panel-scroll{flex:1;overflow-y:auto;padding:20px 24px 32px;scrollbar-width:thin;scrollbar-color:var(--bg3) transparent}
.panel-scroll::-webkit-scrollbar{width:4px}
.panel-scroll::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}

/* === Summary cards === */
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:24px 0 12px;display:flex;align-items:center;gap:8px}
.section-title:first-child{margin-top:0}
.section-title .count{font-size:12px;color:var(--dim);font-weight:400}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.summary-card{background:var(--bg2);border-radius:var(--radius);padding:16px;border:1px solid var(--border);position:relative;overflow:hidden}
.summary-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.summary-card .value{font-size:26px;font-weight:700;line-height:1.1}
.summary-card .sub{font-size:11px;color:var(--dim);margin-top:4px}
.summary-card .delta{font-size:11px;font-weight:600;margin-top:2px}
.summary-card .delta.up{color:var(--green)}
.summary-card .delta.down{color:var(--red)}
.s-green .value{color:var(--green)}
.s-red .value{color:var(--red)}
.s-yellow .value{color:var(--yellow)}
.s-purple .value{color:var(--purple)}
.s-cyan .value{color:var(--cyan)}
.s-accent .value{color:var(--accent)}
.s-orange .value{color:var(--orange)}

/* === Tables === */
.data-table{width:100%;border-collapse:collapse;font-size:13px;background:var(--bg2);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border)}
.data-table thead{background:var(--bg3)}
.data-table th{padding:10px 14px;text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;position:sticky;top:0;z-index:1}
.data-table td{padding:10px 14px;border-top:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:hover{background:rgba(59,130,246,.05)}
.data-table .right{text-align:right}
.data-table .center{text-align:center}
.title-cell{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title-cell a{color:var(--accent);text-decoration:none}
.title-cell a:hover{text-decoration:underline}
.cell-link a{color:var(--accent);font-size:12px;text-decoration:none}
.cell-link a:hover{text-decoration:underline}

.badge-pending{background:rgba(245,158,11,.12);color:var(--yellow);border:1px solid rgba(245,158,11,.25)}

.comment-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.comment-card.negative{border-left:3px solid var(--red)}

.comment-meta .time{color:var(--dim)}
.comment-meta .article-ref{color:var(--muted);font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.comment-body{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px;white-space:pre-wrap}
.comment-reply-box{background:var(--bg3);border-radius:8px;padding:12px 14px;border-left:3px solid var(--accent);margin-top:8px}
.comment-reply-box .reply-header{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.comment-reply-box .reply-label{font-size:11px;color:var(--accent);font-weight:600}
.comment-reply-box .reply-text{font-size:13px;line-height:1.5;color:var(--text);white-space:pre-wrap}
.comment-reply-box .reply-time{font-size:11px;color:var(--dim);margin-top:4px}

/* === Trend === */
.trend-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.trend-row:last-child{border-bottom:none}

.trend-bar-fill{height:100%;border-radius:3px;transition:width .3s}
.trend-val{width:60px;text-align:right;font-weight:600;flex-shrink:0;font-size:12px}

/* === Misc === */

.flex-between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.account-tag{font-size:11px;color:var(--dim);font-family:monospace}

.panel-scroll{padding:12px}
}
</style>

<script>
(function(){
  function fail(msg){
    var el=document.getElementById('panel-overview');
    if(el) el.innerHTML='<div class="error-box">Dashboard render error:\n'+String(msg)+'</div>';
  }
  var DATA;
  try{
    DATA = JSON.parse(document.getElementById('payload').textContent);
  }catch(e){ fail('Data parse failed: '+e.message); return; }

  function esc(s){ if(!s && s!==0) return '-'; var d=document.createElement('div'); d.textContent=String(s); return d.innerHTML; }
  function fmt(n){ if(n===undefined||n===null||(n!==0&&!n)) return '-'; return Number(n).toLocaleString('zh-CN'); }
  function fmtTime(ts){
    if(!ts) return '-';
    var d=new Date(ts);
    if(isNaN(d.getTime())) return '-';
    return d.getMonth()+1+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  }
  function fmtDate(ts){
    if(!ts) return '-';
    var d=new Date(ts);
    if(isNaN(d.getTime())) return '-';
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function badgePub(a){
    if(a && a.matched===false) return '<span class="badge badge-review">审核中</span>';
    return '<span class="badge badge-published">已发布</span>';
  }
  function negBadge(c){
    if(c.negative) return '<span class="badge badge-neg">负面</span>';
    if(c.negative===false) return '<span class="badge badge-pos">正面</span>';
    return '<span class="badge badge-neutral">未标记</span>';
  }
  function replyBadge(c){
    if(c.replied) return '<span class="badge badge-replied">已回复</span>';
    return '<span class="badge badge-pending">待回复</span>';
  }

  // ---- Navigation ----
  document.querySelectorAll('.nav-item').forEach(function(item){
    item.addEventListener('click', function(){
      document.querySelectorAll('.nav-item').forEach(function(b){ b.classList.remove('active'); });
      document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
      item.classList.add('active');
      var panel=document.getElementById('panel-'+item.dataset.panel);
      if(panel) panel.classList.add('active');
    });
  });

  // ============================================================
  // OVERVIEW PAGE
  // ============================================================
  function renderOverview(){
    var el=document.getElementById('panel-overview');
    var ta=(DATA.toutiao&&DATA.toutiao.articles)||[];
    var ya=(DATA.y160&&DATA.y160.articles)||[];

    var totalShow=0,totalRead=0,totalCmt=0,totalDig=0,reviewCount=0;
    ta.forEach(function(a){
      var m=a.metrics||{};
      totalShow+=(m.showCount||0);
      totalRead+=(m.readCount||0);
      totalCmt+=(m.commentCount||0);
      totalDig+=(m.diggCount||0);
      if(a.matched===false) reviewCount++;
    });
    var y160Read=0;
    ya.forEach(function(a){ y160Read+=(a.readCount||0); });

    var totalPublish = ta.length + ya.length;
    var totalReadAll = totalRead + y160Read;
    var allCmts = DATA.allComments||[];

    // Yesterday comparison
    var yta=(DATA.ytoutiao&&DATA.ytoutiao.articles)||[];
    var yya=(DATA.yy160&&DATA.yy160.articles)||[];
    var yShow=0,yRead=0,yDig=0,yCmt=0;
    yta.forEach(function(a){ var m=a.metrics||{}; yShow+=(m.showCount||0); yRead+=(m.readCount||0); yDig+=(m.diggCount||0); yCmt+=(m.commentCount||0); });
    var y160ReadSum=0; yya.forEach(function(a){ y160ReadSum+=(a.readCount||0); });

    function delta(cur, prev){
      if(!prev) return '';
      var d=cur-prev;
      if(d===0) return '<div class="delta" style="color:var(--dim);">持平</div>';
      var pct = prev>0 ? Math.round(d/prev*100) : 0;
      var cls = d>0 ? 'up' : 'down';
      var sign = d>0 ? '+' : '';
      return '<div class="delta '+cls+'">'+sign+fmt(d)+' ('+sign+pct+'%)</div>';
    }

    // Trend mini-chart
    var trend=DATA.trend||[];
    var maxRead=0;
    trend.forEach(function(t){ var r=(t.ttRead||0)+(t.y160Read||0); if(r>maxRead) maxRead=r; });

    var html=
      '<div class="panel-scroll">'+
      '<div class="section-title">全网数据总览 <span class="count">'+esc(DATA.today)+'</span></div>'+
      '<div class="summary-grid">'+
        '<div class="summary-card s-accent"><div class="label">总发布</div><div class="value">'+totalPublish+'</div><div class="sub">头条 '+ta.length+' + 160 '+ya.length+'</div></div>'+
        '<div class="summary-card s-cyan"><div class="label">总展现</div><div class="value">'+fmt(totalShow)+'</div>'+delta(totalShow,yShow)+'</div>'+

        '<div class="summary-card s-yellow"><div class="label">总评论</div><div class="value">'+fmt(totalCmt)+'</div>'+delta(totalCmt,yCmt)+'</div>'+
        '<div class="summary-card s-purple"><div class="label">总点赞</div><div class="value">'+fmt(totalDig)+'</div>'+delta(totalDig,yDig)+'</div>'+
        '<div class="summary-card s-red"><div class="label">审核中</div><div class="value">'+reviewCount+'</div><div class="sub">头条待审</div></div>'+
      '</div>'+

      '<div class="section-title">渠道对比</div>'+
      '<table class="data-table"><thead><tr>'+
        '<th>渠道</th><th class="right">篇数</th><th class="right">展现</th><th class="right">阅读</th><th class="right">评论</th><th class="right">点赞</th><th class="right">审核中</th>'+
      '</tr></thead><tbody>'+
        '<tr><td><span style="color:var(--accent);font-weight:600;">今日头条</span></td><td class="right">'+ta.length+'</td><td class="right">'+fmt(totalShow)+'</td><td class="right">'+fmt(totalRead)+'</td><td class="right">'+fmt(totalCmt)+'</td><td class="right">'+fmt(totalDig)+'</td><td class="right">'+reviewCount+'</td></tr>'+
        '<tr><td><span style="color:var(--green);font-weight:600;">160挂号网</span></td><td class="right">'+ya.length+'</td><td class="right">-</td><td class="right">'+fmt(y160Read)+'</td><td class="right">-</td><td class="right">-</td><td class="right">-</td></tr>'+
        '<tr style="font-weight:600;"><td>合计</td><td class="right">'+(ta.length+ya.length)+'</td><td class="right">'+fmt(totalShow)+'</td><td class="right">'+fmt(totalReadAll)+'</td><td class="right">'+fmt(totalCmt)+'</td><td class="right">'+fmt(totalDig)+'</td><td class="right">'+reviewCount+'</td></tr>'+
      '</tbody></table>';

    // 7-day trend
    if(trend.length>0){
      html+='<div class="section-title">7日趋势 <span class="count">总阅读量</span></div>';
      trend.forEach(function(t){
        var totalR=(t.ttRead||0)+(t.y160Read||0);
        var pct = maxRead>0 ? Math.round(totalR/maxRead*100) : 0;
        html+='<div class="trend-row">'+
          '<div class="trend-date">'+esc(t.date)+'</div>'+
          '<div class="trend-bar"><div class="trend-bar-fill" style="width:'+pct+'%;background:linear-gradient(90deg,var(--accent),var(--cyan));"></div></div>'+
          '<div class="trend-val">'+fmt(totalR)+'</div>'+
        '</div>';
      });
    }

    // Comments summary on overview
    if(allCmts.length>0){
      var negCount=0, repliedCount=0;
      allCmts.forEach(function(c){ if(c.negative) negCount++; if(c.replied) repliedCount++; });
      html+='<div class="section-title">评论概览</div>'+
        '<div class="summary-grid">'+
          '<div class="summary-card"><div class="label">总评论</div><div class="value">'+allCmts.length+'</div></div>'+
          '<div class="summary-card s-red"><div class="label">负面</div><div class="value">'+negCount+'</div></div>'+
          '<div class="summary-card s-green"><div class="label">已回复</div><div class="value">'+repliedCount+'</div></div>'+
          '<div class="summary-card s-yellow"><div class="label">待回复</div><div class="value">'+(allCmts.length-repliedCount)+'</div></div>'+
        '</div>';
    }

    // Login failed accounts warning
    var lf = DATA.loginFailed||[];
    if(lf.length>0){
      html+='<div class="section-title" style="color:var(--red);">账号异常 <span class="count">'+lf.length+' 个登录失败</span></div>';
      html+='<div style="background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:var(--radius);padding:16px;">';
      html+='<div style="font-size:13px;color:var(--muted);margin-bottom:10px;">以下账号密码错误或需要二次验证，请在 <code style="background:var(--bg3);padding:2px 6px;border-radius:4px;">E:/GEO/账号.xlsx</code> 修改后重新采集：</div>';
      html+='<div style="display:flex;flex-wrap:wrap;gap:8px;">';
      lf.forEach(function(p){
        html+='<span style="background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);padding:6px 12px;border-radius:8px;font-family:monospace;font-size:13px;color:var(--red);">'+esc(p)+' <span class="badge badge-neg">账号密码错误</span></span>';
      });
      html+='</div></div>';
    }

    html+='</div>';
    el.innerHTML=html;
  }

  // ============================================================
  // TOUTIAO CHANNEL PAGE
  // ============================================================
  function renderToutiao(){
    var el=document.getElementById('panel-toutiao');
    var ta=(DATA.toutiao&&DATA.toutiao.articles)||[];
    var lfSet={};
    (DATA.loginFailed||[]).forEach(function(p){ lfSet[String(p)]=true; });

    var totalShow=0,totalRead=0,totalCmt=0,totalDig=0,reviewCount=0;
    ta.forEach(function(a){
      var m=a.metrics||{};
      totalShow+=(m.showCount||0);
      totalRead+=(m.readCount||0);
      totalCmt+=(m.commentCount||0);
      totalDig+=(m.diggCount||0);
      if(a.matched===false) reviewCount++;
    });

    // Article table rows
    var rows=ta.slice().sort(function(a,b){ return (b.publishTime||0)-(a.publishTime||0); });
    var tr='';
    rows.forEach(function(a){
      var m=a.metrics||{};
      var phoneStr=String(a.phone||'');
      var phoneBad = lfSet[phoneStr];
      tr+='<tr>';
      tr+='<td class="title-cell">'+esc(a.title)+' '+badgePub(a)+'</td>';
      tr+='<td><div style="font-weight:500;">'+esc(a.name||'-')+'</div></td>';
      tr+='<td class="cell-phone">'+esc(a.phone||'-')+(phoneBad?' <span class="badge badge-neg">账号密码错误</span>':'')+'</td>';
      tr+='<td style="font-size:12px;color:var(--muted);">'+fmtTime(a.publishTime||(a.publishedAt?new Date(a.publishedAt).getTime():0))+'</td>';
      tr+='<td class="right" style="font-weight:600;color:var(--cyan);">'+fmt(m.showCount)+'</td>';
      tr+='<td class="right">'+fmt(m.readCount)+'</td>';
      tr+='<td class="right">'+fmt(m.commentCount)+'</td>';
      tr+='<td class="right">'+fmt(m.diggCount)+'</td>';
      tr+='<td class="cell-link">'+(a.url?'<a href="'+esc(a.url)+'" target="_blank">查看</a>':'<span style="color:var(--dim);">-</span>')+'</td>';
      tr+='</tr>';
    });

    // Filter toutiao comments from allComments
    var ttComments = (DATA.allComments||[]).filter(function(c){
      return c._source==='today' || (c._groupId && c._groupId.length>10);
    });

    var html=
      '<div class="panel-scroll">'+
      // Section 1: Channel data overview
      '<div class="section-title">今日头条 - 数据总览</div>'+
      '<div class="summary-grid">'+
        '<div class="summary-card"><div class="label">总篇数</div><div class="value">'+ta.length+'</div><div class="sub">已发 '+fmt(ta.length-reviewCount)+' / 审核中 '+reviewCount+'</div></div>'+
        '<div class="summary-card s-cyan"><div class="label">总展现</div><div class="value">'+fmt(totalShow)+'</div></div>'+
        '<div class="summary-card s-green"><div class="label">总阅读</div><div class="value">'+fmt(totalRead)+'</div></div>'+
        '<div class="summary-card s-yellow"><div class="label">总评论</div><div class="value">'+fmt(totalCmt)+'</div></div>'+
        '<div class="summary-card s-purple"><div class="label">总点赞</div><div class="value">'+fmt(totalDig)+'</div></div>'+
      '</div>'+

      // Section 2: Article list
      '<div class="section-title">发文内容 <span class="count">'+ta.length+' 篇</span></div>'+
      '<table class="data-table"><thead><tr>'+
        '<th>标题</th><th>发布人</th><th>账号</th><th>发布时间</th><th class="right">展现</th><th class="right">阅读</th><th class="right">评论</th><th class="right">点赞</th><th>查看</th>'+
      '</tr></thead><tbody>'+(tr||'<tr><td colspan="9" class="empty">暂无文章</td></tr>')+'</tbody></table>';

    // Section 3: Comments & replies
    html+='<div class="section-title">评论与回复 <span class="count">'+ttComments.length+' 条</span></div>';
    if(ttComments.length===0){
      html+='<div class="empty"><div class="icon">&#128172;</div>暂无评论数据</div>';
    } else {
      ttComments.forEach(function(c){
        var isNeg = c.negative;
        var cls = isNeg ? 'negative' : 'positive';
        var replyHtml='';
        if(c.replied && c.replyText){
          replyHtml='<div class="comment-reply-box">'+
            '<div class="reply-header"><span class="reply-label">自媒体回复</span>'+replyBadge(c)+'</div>'+
            '<div class="reply-text">'+esc(c.replyText)+'</div>'+
            (c.replyAt?'<div class="reply-time">'+fmtTime(c.replyAt)+'</div>':'')+
          '</div>';
        }
        html+='<div class="comment-card '+cls+'">'+
          '<div class="comment-meta">'+
            '<span class="author">'+esc(c.userName||c.author||'匿名用户')+'</span>'+
            '<span class="time">'+fmtTime(c.createTime||c.time)+'</span>'+
            negBadge(c)+
            replyBadge(c)+
            (c.articleTitle?'<span class="article-ref">来自: '+esc(c.articleTitle)+'</span>':'')+
          '</div>'+
          '<div class="comment-body">'+esc(c.text||c.content||'')+'</div>'+
          replyHtml+
        '</div>';
      });
    }

    html+='</div>';
    el.innerHTML=html;
  }

  // ============================================================
  // 160 CHANNEL PAGE
  // ============================================================
  function renderY160(){
    var el=document.getElementById('panel-y160');
    var ya=(DATA.y160&&DATA.y160.articles)||[];

    var totalRead=0;
    ya.forEach(function(a){ totalRead+=(a.readCount||0); });

    var rows=ya.slice().sort(function(a,b){ return (b.publishTime||0)-(a.publishTime||0); });
    var tr='';
    rows.forEach(function(a){
      tr+='<tr>';
      tr+='<td class="title-cell">'+esc(a.title)+'</td>';
      tr+='<td><div style="font-weight:500;">'+esc(a.publisher||'-')+'</div></td>';
      tr+='<td style="font-size:12px;color:var(--muted);">'+esc(a.publishTimeText||fmtTime(a.publishTime))+'</td>';
      tr+='<td class="right" style="font-weight:600;color:var(--green);">'+fmt(a.readCount)+'</td>';
      tr+='<td>'+esc(a.category||'-')+'</td>';
      tr+='<td class="cell-link">'+(a.id?'<a href="https://www.91160.com/cms/article-'+esc(a.id)+'.html" target="_blank">查看</a>':'-')+'</td>';
      tr+='</tr>';
    });

    var html=
      '<div class="panel-scroll">'+
      '<div class="section-title">健康160 - 数据总览</div>'+
      '<div class="summary-grid">'+
        '<div class="summary-card"><div class="label">总篇数</div><div class="value">'+ya.length+'</div></div>'+
        '<div class="summary-card s-green"><div class="label">总阅读</div><div class="value">'+fmt(totalRead)+'</div></div>'+
      '</div>'+

      '<div class="section-title">发文内容 <span class="count">'+ya.length+' 篇</span></div>'+
      '<table class="data-table"><thead><tr>'+
        '<th>标题</th><th>发布人</th><th>发布时间</th><th class="right">阅读</th><th>分类</th><th>查看</th>'+
      '</tr></thead><tbody>'+(tr||'<tr><td colspan="6" class="empty">暂无文章</td></tr>')+'</tbody></table>'+

      '<div class="section-title">评论与回复 <span class="count">160暂无评论数据</span></div>'+
      '<div class="empty"><div class="icon">&#128172;</div>160挂号网暂不支持评论采集</div>'+
      '</div>';

    el.innerHTML=html;
  }

  // ---- Update sidebar badges ----
  function updateBadges(){
    var ta=(DATA.toutiao&&DATA.toutiao.articles)||[];
    var ya=(DATA.y160&&DATA.y160.articles)||[];
    var b1=document.getElementById('badge-tt');
    var b2=document.getElementById('badge-160');
    if(b1) b1.textContent=ta.length;
    if(b2) b2.textContent=ya.length;
  }

  // ---- Run ----
  try{
    renderOverview();
    renderToutiao();
    renderY160();
    updateBadges();
  }catch(e){ fail(e && e.stack ? e.stack : e); }
})();
</script>
</body>
</html>
